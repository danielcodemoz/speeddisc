name: SpeedDisc GUI Windows smoke

on:
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'internal/**'
      - 'winres/**'
      - 'scripts/*gui*'
      - '.github/workflows/gui-windows-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui-smoke:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Vet and run synthetic fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          go vet ./...
          go test -count=1 ./...
          go vet -tags speeddiscgui ./...
          go test -tags speeddiscgui -count=1 ./...
      - name: Build and validate independent GUI PE
        shell: pwsh
        run: |
          python scripts/build-gui.py --output "$env:RUNNER_TEMP/gui-app/SpeedDisc-GUI.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launch and exit GUI without performing any operations
        shell: pwsh
        run: |
          ./scripts/smoke-gui.ps1 -Executable "$env:RUNNER_TEMP/gui-app/SpeedDisc-GUI.exe" -EvidenceDirectory "$env:RUNNER_TEMP/gui-evidence"
      - name: Capture the optional read-only demo with synthetic report
        shell: pwsh
        run: |
          ./scripts/smoke-gui.ps1 -Executable "$env:RUNNER_TEMP/gui-app/SpeedDisc-GUI.exe" -EvidenceDirectory "$env:RUNNER_TEMP/gui-evidence/demo" -Demo
      - name: Capture compact English in-progress demo using synthetic state
        shell: pwsh
        run: |
          ./scripts/smoke-gui.ps1 -Executable "$env:RUNNER_TEMP/gui-app/SpeedDisc-GUI.exe" -EvidenceDirectory "$env:RUNNER_TEMP/gui-evidence/running-en" -Running
      - name: Retain window proof when available (no executable)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: speeddisc-gui-smoke
          path: ${{ runner.temp }}/gui-evidence/
          retention-days: 7
          if-no-files-found: error
